  <rect width="1200" height="760" rx="80" fill="url(#bg)"/>
  <circle cx="600" cy="330" r="280" fill="none" stroke="#fff" stroke-width="3" opacity=".85"/>
  <circle cx="600" cy="330" r="235" fill="none" stroke="#ddd6cc" stroke-width="2" opacity=".75"/>
