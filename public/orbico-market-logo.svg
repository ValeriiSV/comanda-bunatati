    <g transform="translate(290 0)"><rect width="125" height="100" rx="20" fill="#ffffffaa" stroke="#fff"/><text x="62" y="45" font-size="34">▰</text><text x="62" y="75" font-size="16" fill="#20262a">CASĂ</text></g>
