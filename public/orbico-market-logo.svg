    <linearGradient id="dark" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#272d31"/><stop offset="1" stop-color="#14191c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity=".16"/></filter>
