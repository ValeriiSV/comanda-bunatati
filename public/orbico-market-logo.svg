    <g transform="translate(580 0)"><rect width="125" height="100" rx="20" fill="#ffffffaa" stroke="#fff"/><text x="62" y="45" font-size="34">●</text><text x="62" y="75" font-size="15" fill="#20262a">SPORT</text></g>
    <g transform="translate(725 0)"><rect width="125" height="100" rx="20" fill="#ffffffaa" stroke="#fff"/><text x="62" y="45" font-size="34">•••</text><text x="62" y="78" font-size="17" fill="#20262a">ALTELE</text></g>
