<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/valera-logo.svg?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bunătăți împreună cu Valera</title>
    <meta name="description" content="Bunătăți împreună cu Valera — comanda comună de nuci, fructe uscate și dulciuri." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/product-images.js?v=4" defer></script>
    <script>
      (() => {
        if (location.pathname !== '/') return;
        let attempts = 0;
        const timer = setInterval(() => {
          attempts += 1;
          const header = document.querySelector('header');
          const title = header?.querySelector('p.font-serif');
          if (title) {
            title.textContent = 'Bunătăți împreună cu Valera';
            const brand = title.parentElement?.parentElement;
            const oldIcon = brand?.querySelector(':scope > span');
            if (oldIcon) {
              oldIcon.innerHTML = '<img src="/valera-logo.svg?v=3" alt="Bunătăți împreună cu Valera" style="width:40px;height:40px;border-radius:999px;object-fit:cover;display:block" />';
              oldIcon.style.background = 'transparent';
              oldIcon.style.overflow = 'hidden';
            }
            clearInterval(timer);
          } else if (attempts >= 50) {
            clearInterval(timer);
          }
        }, 100);
      })();
    </script>
  </body>
</html>
