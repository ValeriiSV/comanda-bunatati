<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/valera-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bunătăți împreună cu Valera</title>
    <meta name="description" content="Bunătăți împreună cu Valera — comanda comună de nuci, fructe uscate și dulciuri." />
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (location.pathname === '/') {
        const applyBrand = () => {
          const title = document.querySelector('header p.font-serif');
          if (!title) return;
          title.textContent = 'Bunătăți împreună cu Valera';
          const brand = title.parentElement?.parentElement;
          const icon = brand?.querySelector(':scope > span');
          if (icon && !icon.querySelector('img[data-valera-logo]')) {
            icon.innerHTML = '<img data-valera-logo src="/valera-logo.svg" alt="Bunătăți împreună cu Valera" style="width:40px;height:40px;border-radius:999px;object-fit:cover" />';
            icon.style.background = 'transparent';
          }
        };
        const observer = new MutationObserver(applyBrand);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        window.addEventListener('load', applyBrand);
        applyBrand();
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
